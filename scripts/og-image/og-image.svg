<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Mirrors the site's h1 text-shadow: 0 0 1.25rem rgba(255,255,255,.2), 0 0 4.5rem rgba(255,255,255,.3) -->
    <filter id="glow" x="-75%" y="-75%" width="250%" height="250%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur1"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.2" result="color1"/>
      <feComposite in="color1" in2="blur1" operator="in" result="glow1"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="36" result="blur2"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.3" result="color2"/>
      <feComposite in="color2" in2="blur2" operator="in" result="glow2"/>

      <feMerge>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#281733"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- "Puzzle Piece" icon from Phosphor Icons (https://phosphoricons.com), MIT licensed -->
