  </g>

  <text x="600" y="400" text-anchor="middle" font-family="SN Pro" font-size="72" font-weight="800" fill="#a4a0e8" filter="url(#glow)">Helix Editor Plugins</text>
  <text x="600" y="452" text-anchor="middle" font-family="SN Pro" font-size="30" font-weight="400" fill="#bcbcbc">A searchable list of plugins for the Helix text editor</text>
